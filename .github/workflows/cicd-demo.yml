name: CI/CD Pipeline Demo

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build check
        run: |
          test -f application.conf
          echo "PASS - configuration file exists"

      - name: Test configuration
        run: |
          grep -q '^port=8080$' application.conf
          echo "PASS - required port setting is valid"

      - name: Package configuration
        run: |
          mkdir -p artifacts
          tar -czf artifacts/demo-app.tar.gz application.conf
          echo "PASS - package created"

      - name: Deploy to temporary staging
        run: |
          mkdir -p staging
          cp artifacts/demo-app.tar.gz staging/
          tar -xzf staging/demo-app.tar.gz -C staging
          echo "PASS - package extracted to staging"

      - name: Verify staged configuration
        run: |
          grep -q '^port=8080$' staging/application.conf
          echo "PASS - staged configuration verified"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-app-package
          path: artifacts/demo-app.tar.gz
